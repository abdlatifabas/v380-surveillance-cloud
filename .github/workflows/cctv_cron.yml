name: 🗑️ CCTV Daily Auto-Purge

on:
  schedule:
    # Jalankan setiap tengah malam UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install --quiet requests pillow cryptography

      - name: Run Auto-Purge
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RETENTION_DAYS: "3"
        run: |
          python3 recorder.py purge
